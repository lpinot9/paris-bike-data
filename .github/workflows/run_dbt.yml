name: dbt Transformation

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Bike Data ELT Pipeline (dlt + dbt)"]
    types:
      - completed

jobs:
  transform-dbt:
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
      DBT_PROFILES_DIR: ./dbt_project 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python for dbt
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dbt-snowflake
        run: pip install dbt-snowflake==1.7.*

      - name: Run dbt deps and build
        run: |
          dbt deps --project-dir ./dbt_project
          dbt build --project-dir ./dbt_project
